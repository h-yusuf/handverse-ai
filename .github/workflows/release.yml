name: Desktop release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-release.mjs --notes
      - name: Create or reuse draft release for a version tag
        id: release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "HANDVERSE $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify platform build prerequisites
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            xcodebuild -version
            xcrun --find clang
          else
            powershell -NoProfile -Command 'if (-not (Test-Path "${env:ProgramFiles(x86)}/Windows Kits/10")) { throw "Windows SDK missing" }'
          fi
      - run: npm ci
      - name: Production frontend, assets, tests and Rust checks
        run: npm run check:ci -- ${{ matrix.target }}
      - name: Default to unsigned testing configuration
        run: node -e "require('fs').writeFileSync('ci-signing.json', '{}')"
      - name: Configure optional macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/configure-macos-signing.mjs
      - name: Optional Windows certificate import
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_PASSWORD -and -not $env:WINDOWS_CERTIFICATE) { throw 'WINDOWS_CERTIFICATE is required with its password' }
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'handverse-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
              $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
              if (-not $cert) { throw 'No certificate imported' }
              @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com'; tsp = $true } } } | ConvertTo-Json -Depth 5 | Set-Content ci-signing.json
            } finally {
              Remove-Item $pfx -ErrorAction SilentlyContinue
            }
          }
      - name: Build installers and upload to draft GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ci-signing.json --verbose -- --locked
          releaseId: ${{ needs.prepare.outputs.release-id }}
      - name: Require installers and verify embedded offline assets
        run: node scripts/check-bundles.mjs ${{ matrix.target }}
      - name: Preserve check logs and installers, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handverse-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/logs/*.log
            app/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            app/target/${{ matrix.target }}/release/bundle/msi/*.msi
      - name: Remove imported Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path ci-signing.json) {
            $thumbprint = (Get-Content ci-signing.json -Raw | ConvertFrom-Json).bundle.windows.certificateThumbprint
            if ($thumbprint) { Remove-Item "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue }
          }
  publish:
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish only after all installers and asset checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
